name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt

  emulator-test:
    name: Emulator Install & Crash Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: apk/

      - name: Run emulator test
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: |
            set -e
            PKG=$(grep -oP "applicationId\s*[\"']\K[^\"']+" app/build.gradle | head -1)
            if [ -z "$PKG" ]; then
              echo "FAILED: could not detect applicationId in app/build.gradle"
              exit 1
            fi
            echo "Detected package: $PKG"
            adb install -r apk/app-debug.apk
            sleep 3
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
            echo "App launched, waiting 25s..."
            sleep 25
            adb shell pidof "$PKG" && echo "PROCESS RUNNING" || echo "PROCESS NOT RUNNING"
            adb logcat -d > full_logcat.txt
            adb exec-out screencap -p > screenshot.png || true
            if grep -q "FATAL EXCEPTION" full_logcat.txt; then
              echo "=========================================="
              echo "APP CRASHED - FATAL EXCEPTION DETECTED"
              grep -A 40 "FATAL EXCEPTION" full_logcat.txt | head -80
              echo "=========================================="
              exit 1
            fi
            if grep -q "Fatal signal" full_logcat.txt; then
              echo "APP CRASHED - NATIVE FATAL SIGNAL"
              grep -A 20 "Fatal signal" full_logcat.txt | head -40
              exit 1
            fi
            if ! adb shell pidof "$PKG" > /dev/null; then
              echo "APP PROCESS DIED (no exception logged)"
              exit 1
            fi
            echo "NO_CRASH_DETECTED - app runs fine"

      - name: Upload logcat + screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            full_logcat.txt
            screenshot.png
