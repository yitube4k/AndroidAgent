android {
    namespace 'com.yitube4k.agecalculator'
    compileSdk 34
    defaultConfig {
        applicationId 'com.yitube4k.agecalculator'
        minSdk 24
        targetSdk 34
        kotlinOptions {
            jvmTarget = '17'
        }
        compileOptions {
            JavaVersion VERSION_17
        }
    }
    buildFeatures {
        viewBinding false
        dataBinding false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}